version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_agent_hub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_password
      POSTGRES_DB: ai_agent_hub
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_agent_hub_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8333 --reload
    ports:
      - "8333:8333"
    environment:
      # Application uses dedicated user, not admin
      DATABASE_URL: postgresql://ai_agent_app:ai_agent_app_password@db:5432/ai_agent_hub
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:4200,http://localhost:3000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile.dev
  #   container_name: ai_agent_hub_frontend
  #   ports:
  #     - "4200:4200"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     ANGULAR_CLI_CACHE: /tmp/.ng
  #   networks:
  #     - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
