<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle representing hub -->
  <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Center node (main hub) -->
  <circle cx="24" cy="24" r="5" fill="currentColor"/>
  
  <!-- Orbiting nodes (agents) -->
  <circle cx="24" cy="8" r="3" fill="currentColor" opacity="0.8"/>
  <circle cx="38" cy="16" r="3" fill="currentColor" opacity="0.8"/>
  <circle cx="38" cy="32" r="3" fill="currentColor" opacity="0.8"/>
  <circle cx="24" cy="40" r="3" fill="currentColor" opacity="0.8"/>
  <circle cx="10" cy="32" r="3" fill="currentColor" opacity="0.8"/>
  <circle cx="10" cy="16" r="3" fill="currentColor" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="24" y1="19" x2="24" y2="11" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="27.5" y1="21.5" x2="35" y2="18.5" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="27.5" y1="26.5" x2="35" y2="29.5" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="29" x2="24" y2="37" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="20.5" y1="26.5" x2="13" y2="29.5" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  <line x1="20.5" y1="21.5" x2="13" y2="18.5" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Small particles for AI effect -->
  <circle cx="32" cy="12" r="1" fill="currentColor" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="24" r="1" fill="currentColor" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="36" r="1" fill="currentColor" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="36" r="1" fill="currentColor" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="6" cy="24" r="1" fill="currentColor" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="12" r="1" fill="currentColor" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
