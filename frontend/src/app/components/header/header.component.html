<header class="app-header">
  <div class="header-container">
    <!-- Logo and Brand -->
    <div class="header-brand">
      <a routerLink="/" class="brand-link" (click)="closeMenu()">
        <img 
          src="/logo.svg" 
          alt="AI Agent Hub Logo" 
          class="brand-logo"
        />
        <div class="brand-text">
          <h1 class="brand-title">AI Agent Hub</h1>
          <p class="brand-tagline">Discover the Future of AI</p>
        </div>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path d="M8.707 1.5a1 1 0 00-1.414 0L.646 8.146a.5.5 0 00.708.708L2 8.207V13.5A1.5 1.5 0 003.5 15h9a1.5 1.5 0 001.5-1.5V8.207l.646.647a.5.5 0 00.708-.708L13 5.793V2.5a.5.5 0 00-.5-.5h-1a.5.5 0 00-.5.5v1.293L8.707 1.5zM13 7.207V13.5a.5.5 0 01-.5.5h-9a.5.5 0 01-.5-.5V7.207l5-5 5 5z"/>
        </svg>
        Home
      </a>
      <a routerLink="/agents" routerLinkActive="active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm2-3a2 2 0 11-4 0 2 2 0 014 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
        </svg>
        AI Agents
      </a>
      <a routerLink="/mcp-servers" routerLinkActive="active" class="nav-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" class="nav-icon">
          <path d="M0 1.5A.5.5 0 01.5 1H2a.5.5 0 01.485.379L2.89 3H14.5a.5.5 0 01.491.592l-1.5 8A.5.5 0 0113 12H4a.5.5 0 01-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 01-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 100 4 2 2 0 000-4zm7 0a2 2 0 100 4 2 2 0 000-4zm-7 1a1 1 0 110 2 1 1 0 010-2zm7 0a1 1 0 110 2 1 1 0 010-2z"/>
        </svg>
        MCP Servers
      </a>
    </nav>

    <!-- Right Side Actions -->
    <div class="header-actions">
      <!-- User Profile Menu -->
      <div class="profile-menu-wrapper" (click)="onDropdownClick($event)">
        <button
          class="user-button"
          type="button"
          aria-label="User menu"
          aria-haspopup="menu"
          [attr.aria-expanded]="isProfileMenuOpen()"
          [class.active]="isProfileMenuOpen()"
          (click)="toggleProfileMenu($event)"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
        </button>

        <!-- Profile Dropdown -->
        @if (isProfileMenuOpen()) {
          <div class="profile-dropdown" role="menu" aria-label="Account and settings">
            <!-- Signed-in header -->
            <div class="dropdown-header">
              <span class="dropdown-avatar" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
                </svg>
              </span>
              <div class="dropdown-user-info">
                <span class="dropdown-user-name">Guest User</span>
                <span class="dropdown-user-email">Sign in to personalize</span>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <!-- Account links -->
            <a href="#" class="dropdown-item" role="menuitem" (click)="$event.preventDefault(); closeProfileMenu()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z"/>
              </svg>
              Profile Overview
            </a>
            <a href="#" class="dropdown-item" role="menuitem" (click)="$event.preventDefault(); closeProfileMenu()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.22l-2.39.96a7.03 7.03 0 00-1.63-.94l-.36-2.54a.5.5 0 00-.5-.43h-3.84a.5.5 0 00-.5.43l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 00-.61.22L2.63 8.84a.5.5 0 00.12.64l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.13.23.4.32.61.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.25.25.43.5.43h3.84c.25 0 .46-.18.5-.43l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.21.1.48.01.61-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/>
              </svg>
              Account Settings
            </a>

            <div class="dropdown-divider"></div>

            <!-- Theme Settings -->
            <p class="dropdown-section-label" id="theme-settings-label">Theme Settings</p>
            <app-theme-picker aria-labelledby="theme-settings-label"></app-theme-picker>

            <div class="dropdown-divider"></div>

            <!-- Log Out -->
            <button type="button" class="dropdown-item logout-item" role="menuitem" (click)="logout()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17 8l-1.41 1.41L17.17 11H9v2h8.17l-1.58 1.59L17 16l4-4-4-4zM5 5h6V3H5a2 2 0 00-2 2v14a2 2 0 002 2h6v-2H5V5z"/>
              </svg>
              Log Out
            </button>
          </div>
        }
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle menu">
        <svg *ngIf="!isMobileMenuOpen" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
        <svg *ngIf="isMobileMenuOpen" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation -->
  <nav class="nav-mobile" [class.open]="isMobileMenuOpen">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link-mobile" (click)="closeMenu()">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8.707 1.5a1 1 0 00-1.414 0L.646 8.146a.5.5 0 00.708.708L2 8.207V13.5A1.5 1.5 0 003.5 15h9a1.5 1.5 0 001.5-1.5V8.207l.646.647a.5.5 0 00.708-.708L13 5.793V2.5a.5.5 0 00-.5-.5h-1a.5.5 0 00-.5.5v1.293L8.707 1.5zM13 7.207V13.5a.5.5 0 01-.5.5h-9a.5.5 0 01-.5-.5V7.207l5-5 5 5z"/>
      </svg>
      Home
    </a>
    <a routerLink="/agents" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm2-3a2 2 0 11-4 0 2 2 0 014 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
      </svg>
      AI Agents
    </a>
    <a routerLink="/mcp-servers" routerLinkActive="active" class="nav-link-mobile" (click)="closeMenu()">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
        <path d="M0 1.5A.5.5 0 01.5 1H2a.5.5 0 01.485.379L2.89 3H14.5a.5.5 0 01.491.592l-1.5 8A.5.5 0 0113 12H4a.5.5 0 01-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 01-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 100 4 2 2 0 000-4zm7 0a2 2 0 100 4 2 2 0 000-4zm-7 1a1 1 0 110 2 1 1 0 010-2zm7 0a1 1 0 110 2 1 1 0 010-2z"/>
      </svg>
      MCP Servers
    </a>
  </nav>
</header>
